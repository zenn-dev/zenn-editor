name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - canary
    paths-ignore:
      - '**/package.json'
      - 'lerna.json'
      - '**.md'
      - 'packages/example/**'

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://npm.flatt.tech

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: ビルド時に使用する環境変数を設定
        run: |
          touch ./packages/zenn-cli/.env
          echo VITE_EMBED_SERVER_ORIGIN=${{ vars.VITE_EMBED_SERVER_ORIGIN }} >> ./packages/zenn-cli/.env

      - name: パッケージをインストール
        run: pnpm install

      # lernaがGitHub上でコミットできるようにする
      - name: Configure git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      - name: '[main] Get PR labels'
        if: github.ref_name == 'main'
        id: pr-labels
        run: |
          # マージコミットから関連するPRのラベルを取得
          PR_NUMBER=$(gh pr list --state merged --base main --json number,mergeCommit --jq ".[] | select(.mergeCommit.oid == \"${{ github.sha }}\") | .number")
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view $PR_NUMBER --json labels --jq '.labels[].name' | tr '\n' ' ')
            echo "labels=$LABELS" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: '[main] Determine version type'
        if: github.ref_name == 'main'
        id: version-type
        run: |
          LABELS="${{ steps.pr-labels.outputs.labels }}"
          if echo "$LABELS" | grep -q "release:major"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "release:minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: '[main] Bump version'
        if: github.ref_name == 'main'
        run: pnpm lerna version ${{ steps.version-type.outputs.type }} --yes --no-private
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: '[canary] Bump version'
        if: github.ref_name == 'canary'
        run: pnpm lerna version prerelease --yes --no-private
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set released version to env
        run: node -p -e '`RELEASED_PACKAGE_VERSION=${require("./lerna.json").version}`' >> $GITHUB_ENV

      - name: '[main] Create release'
        if: github.ref_name == 'main'
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          version: ${{ env.RELEASED_PACKAGE_VERSION }}
          name: ${{ env.RELEASED_PACKAGE_VERSION }}
          tag: ${{ env.RELEASED_PACKAGE_VERSION }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: '[canary] Create release'
        if: github.ref_name == 'canary'
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          version: ${{ env.RELEASED_PACKAGE_VERSION }}
          name: ${{ env.RELEASED_PACKAGE_VERSION }}
          tag: ${{ env.RELEASED_PACKAGE_VERSION }}
          publish: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: '[main] Publish'
        if: github.ref_name == 'main'
        run: pnpm lerna publish from-package --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: '[canary] Publish'
        if: github.ref_name == 'canary'
        run: pnpm lerna publish from-package --yes --pre-dist-tag canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: '[main] Checkout'
        if: github.ref_name == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: canary

      - name: '[main] Reflect changes on main branch to canary branch'
        if: github.ref_name == 'main'
        run: |
          git pull origin main
          git push origin HEAD
