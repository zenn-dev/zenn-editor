name: E2E Test on Cross Platform
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - canary
    types: [opened, synchronize]

env:
  NPM_CONFIG_REGISTRY: https://npm.flatt.tech

jobs:
  # zenn-editor packagesをwindowsでビルドする環境は整っていないため、linux環境でビルドして、zenn-cliのバンドルファイルをactions/cacheに保存しておく
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - name: パッケージをインストール
        run: pnpm install

      - name: ビルド
        run: pnpm build

      - name: zenn-cliの実行に必要なdistディレクトリをキャッシュ
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/zenn-cli/dist
            packages/zenn-markdown-html/dist
          key: zenn-cli-dist-${{ github.sha }}
          enableCrossOsArchive: true

  # actions/cacheからzenn-cliのバンドルファイルを復元して、E2Eテストを実行する (Linux)
  e2e-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - name: パッケージをインストール
        run: pnpm install

      - name: zenn-cliの実行に必要なdistディレクトリをキャッシュから復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/zenn-cli/dist
            packages/zenn-markdown-html/dist
          key: zenn-cli-dist-${{ github.sha }}
          enableCrossOsArchive: true

      - name: zenn-cliのE2Eテストを実行
        run: pnpm -C packages/zenn-cli e2e

  # Windows環境ではsafe-chainが動作しないため、Linux成功後に実行
  e2e-windows:
    needs: e2e-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - name: パッケージをインストール
        run: pnpm install

      - name: zenn-cliの実行に必要なdistディレクトリをキャッシュから復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/zenn-cli/dist
            packages/zenn-markdown-html/dist
          key: zenn-cli-dist-${{ github.sha }}
          enableCrossOsArchive: true

      - name: zenn-cliのE2Eテストを実行
        run: pnpm -C packages/zenn-cli e2e
        shell: pwsh
