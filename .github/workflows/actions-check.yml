# GitHub Actions workflowを静的解析する
# zizmor 単体で SHA pinning (unpinned-uses) や excessive-permissions 等を一括検査する。
# min-severity: high の検出があれば job を失敗させる。
# この job を required check に設定することで、PR のマージを止められる。
name: actions check

on:
  pull_request:
    branches:
      - main
      - canary

jobs:
  zizmor:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          min-severity: high
          online-audits: true
          # online-audits 時の GitHub REST API 呼び出しに使うトークン。
          # 未指定でも token のデフォルトが ${{ github.token }} のため認証済み
          # (5,000 req/h) で動作し、未認証の 60 req/h 制限には掛からない。
          # 明示する場合は下記を有効化する（挙動は変わらず意図の明確化のみ）。
          # token: ${{ secrets.GITHUB_TOKEN }}
          # annotations と advanced-security(default true) は排他のため
          # advanced-security を明示的に無効化する。
          # 有効のままだと action 起動時に "Mutually exclusive options" で die する。
          advanced-security: false
          annotations: true
