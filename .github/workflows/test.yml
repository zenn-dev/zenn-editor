name: Test zenn-editor
permissions:
  contents: read

on:
  # README の CI バッジで canary の状態を表示するため、canary への push でも実行する
  push:
    branches:
      - canary
  pull_request:
    branches:
      - main
      - canary
    types: [opened, synchronize]

env:
  NPM_CONFIG_REGISTRY: https://npm.flatt.tech

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.24.0

      - name: パッケージをインストール
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run tests for zenn-markdown-html
        run: pnpm test
        working-directory: packages/zenn-markdown-html

      - name: Run tests for zenn-cli
        run: pnpm test
        working-directory: packages/zenn-cli

      - name: Run tests for zenn-embed-elements
        run: pnpm test
        working-directory: packages/zenn-embed-elements
